name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests examples benchmarks
          ruff format --check src tests examples benchmarks
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov=rulelens --cov-report=term-missing --cov-fail-under=90

  examples:
    name: Policies, tests and change gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Lint example policies (warnings fail the build)
        run: rulelens lint --strict examples/lending/policy*.toml examples/fraud/policy*.toml examples/claims/policy.toml examples/trials/policy.toml
      - name: Run each policy's embedded tests
        run: rulelens test examples/lending/policy*.toml examples/fraud/policy*.toml examples/claims/policy.toml examples/trials/policy.toml
      - name: Policy change gate (replay v2 against history, fail if >25% of decisions change)
        run: |
          rulelens diff examples/lending/policy.toml examples/lending/policy_v2.toml \
            examples/lending/applications.csv --id-field applicant_id --group-by region \
            --max-change-rate 0.25 --html policy-impact.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-impact-report
          path: policy-impact.html

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, install the wheel into a clean environment, and run it
        run: |
          pip install build
          python -m build
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/rulelens --version
          /tmp/clean/bin/rulelens decide examples/lending/policy.toml \
            --json '{"credit_score": 760, "annual_income": 90000, "monthly_debt": 1200, "loan_amount": 250000, "property_value": 400000, "employment_months": 60, "bankruptcies_7y": 0}' --brief
